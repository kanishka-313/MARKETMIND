<div class="panel">
  <div class="panel-header">
    <span class="eyebrow">History</span>
    <button class="refresh" (click)="load()" title="Refresh">⟲</button>
  </div>

  <div class="list">
    @if (runs().length === 0) {
      <div class="empty">No previous runs.</div>
    }
    @for (r of runs(); track r.id) {
      <button class="run-item" [class.active]="r.id === activeId" (click)="pick(r.id)">
        <div class="run-symbol">{{ r.symbol }}</div>
        <div class="run-meta">
          <span class="status status-{{ r.status }}">{{ r.status }}</span>
          <span class="when">{{ formatRelative(r.created_at) }}</span>
        </div>
      </button>
    }
  </div>
</div>
